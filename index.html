<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6f8f86">
    <title>Psicóloga Fernanda Moura | Avaliação Inicial</title>
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/jspdf.umd.min.js" defer></script>
    <script src="vendor/lucide.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="brand-panel" aria-label="Psicóloga Fernanda Moura">
        <div class="brand-art" role="img" aria-label="Sala acolhedora de atendimento psicológico"></div>
        <div class="brand-content">
          <p class="brand-kicker">Avaliação inicial</p>
          <h1>Psicóloga Fernanda Moura</h1>
          <p class="brand-copy">Um espaço de escuta, cuidado e organização emocional.</p>
          <a class="icon-button whatsapp-contact" href="https://wa.me/5521999064406" target="_blank" rel="noopener noreferrer" title="Fale comigo pelo WhatsApp">
            <i data-lucide="message-circle" aria-hidden="true"></i>
            <span>Fale comigo!</span>
          </a>
          <div class="privacy-note">
            <i data-lucide="shield-check" aria-hidden="true"></i>
            <span>As respostas ficam neste dispositivo até o PDF ser compartilhado.</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="page-kicker">Questionário de Avaliação Inicial</p>
            <h2>Preenchimento do paciente</h2>
          </div>
          <div class="progress-card" aria-live="polite">
            <span id="progressLabel">0% preenchido</span>
            <div class="progress-track" aria-hidden="true">
              <div id="progressFill"></div>
            </div>
          </div>
        </header>

        <div class="content-layout">
          <nav class="section-nav" id="sectionNav" aria-label="Etapas do questionário"></nav>

          <form class="form-panel" id="evaluationForm" autocomplete="on">
            <div id="formSections"></div>

            <footer class="action-bar">
              <button type="button" class="icon-button ghost" id="clearButton" title="Limpar respostas">
                <i data-lucide="trash-2" aria-hidden="true"></i>
                <span>Limpar</span>
              </button>
              <div class="primary-actions">
                <button type="button" class="icon-button secondary" id="downloadButton" title="Baixar PDF">
                  <i data-lucide="download" aria-hidden="true"></i>
                  <span>Baixar PDF</span>
                </button>
                <button type="button" class="icon-button primary" id="shareButton" title="Compartilhar PDF">
                  <i data-lucide="send" aria-hidden="true"></i>
                  <span>Compartilhar</span>
                </button>
              </div>
            </footer>
          </form>
        </div>
      </main>
    </div>

    <dialog class="share-dialog" id="shareDialog">
      <div class="dialog-header">
        <i data-lucide="message-circle" aria-hidden="true"></i>
        <h3>Compartilhar pelo WhatsApp</h3>
      </div>
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button type="button" class="icon-button secondary" id="closeDialogButton">
          <i data-lucide="x" aria-hidden="true"></i>
          <span>Fechar</span>
        </button>
        <button type="button" class="icon-button primary" id="openWhatsAppButton">
          <i data-lucide="external-link" aria-hidden="true"></i>
          <span>Abrir WhatsApp</span>
        </button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
